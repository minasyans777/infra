# The resource every tenant's ExternalSecret (in gitops) actually depends on —
# gitops/helm/edusystems-org/values.yaml's `vault.clusterSecretStoreName` just
# names this by string, it doesn't create it. Previously applied by hand and left
# untracked (created 2026-06-12, before this repo existed) — that's exactly how it
# went stale and pointed at http:// after Vault moved to TLS, breaking every
# tenant's secret sync. Tracking it here so that can't happen silently again.
#
# `role: external-secrets` / the serviceAccountRef below must match
# terraform/auth-kubernetes.tf's vault_kubernetes_auth_backend_role.external_secrets
# and variables.tf's eso_service_account_name/namespace defaults — if you change
# one, change the other.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault-active.vault.svc.cluster.local:8200"
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: vault-ca-key-pair
        namespace: vault
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

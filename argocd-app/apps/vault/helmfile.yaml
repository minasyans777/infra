repositories:
  - name: hashicorp
    url: https://helm.releases.hashicorp.com

releases:
  - name: vault
    namespace: vault
    createNamespace: false   # created by tls/00-namespace.yaml, applied first — see README.md
    chart: hashicorp/vault
    version: 0.34.1          # vault-helm chart version, not the Vault app version (pinned in values/vault.yaml)
    values:
      - helm/values/vault.yaml
    # Requires tls/*.yaml already applied and vault-server-tls issued (kubectl get certificate -n vault),
    # otherwise the pods crash-loop looking for a TLS secret that doesn't exist yet. See README.md.

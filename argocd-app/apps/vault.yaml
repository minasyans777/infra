apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      values: |
        server:
          dataStorage:
            enabled: true
            size: 10Gi

          # 1. Ճիշտ կերպով սահմանում ենք Volume Mount-ը Pod-ի ներսում
          extraVolumeMounts:
            - name: vault-tls-volume
              mountPath: /vault/userconfig/vault-tls
              readOnly: true

          # 2. Ճիշտ կերպով կապում ենք Kubernetes Secret-ը որպես Volume
          extraVolumes:
            - name: vault-tls-volume
              secret:
                secretName: vault-tls-secret # Ձեր cert-manager Secret-ի անունը

          # 3. Configure Vault TCP listener
          standalone:
            config: |
              listener "tcp" {
                address     = "0.0.0.0:8200"
                tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
                tls_key_file  = "/vault/userconfig/vault-tls/tls.key"
              }
              storage "file" {
                path = "/vault/data"
              }
              disable_mlock = true

          # 4. Change probe schemes to HTTPS
          readinessProbe:
            scheme: HTTPS
          livenessProbe:
            scheme: HTTPS
            initialDelaySeconds: 60
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle


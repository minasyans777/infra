apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: hashicorp/vault
    targetRevision: 0.34.1
    helm:
      values: |
        server:
          dataStorage:
            enabled: true
            size: 10Gi

  destination:
    server: 'https://default.svc'
    namespace: vault
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true

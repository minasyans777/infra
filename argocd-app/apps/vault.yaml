apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      values: |
        server:
          dataStorage:
            enabled: true
            size: 10Gi
          
          # 1. Mount the secret generated by cert-manager
          extraVolumes:
            - type: secret
              name: vault-tls-secret   # Matches spec.secretName from your Certificate
              path: /vault/userconfig/vault-tls

          # 2. Configure Vault TCP listener with the paths from the mount
          standalone:
            config: |
              listener "tcp" {
                address     = "0.0.0.0:8200"
                tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
                tls_key_file  = "/vault/userconfig/vault-tls/tls.key"
              }
              storage "file" {
                path = "/vault/data"
              }
              disable_mlock = true

          # 3. Change probe schemes to HTTPS since TLS is enabled
          readinessProbe:
            scheme: HTTPS
          livenessProbe:
            scheme: HTTPS
            initialDelaySeconds: 60
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      values: |
        server:
          dataStorage:
            enabled: true
            size: 10Gi

          # 1. Միացնում ենք TLS աջակցությունը Helm Chart-ի մակարդակով
          tls:
            enabled: true
            # Նշում ենք այն Secret-ի անունը, որը ստեղծել էիք (tls.crt և tls.key)
            secretName: vault-tls-secret

          # 2. Փոխում ենք ներքին Vault-ի կոնֆիգուրացիան extraConfig-ի միջոցով
          extraConfig: |
            ui = true

            listener "tcp" {
              address     = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = 0
              # Helm chart-ը ավտոմատ մաունթ է անում սեկրետը այս հասցեով.
              tls_cert_file = "/vault/userconfig/vault-tls-secret/tls.crt"
              tls_key_file  = "/vault/userconfig/vault-tls-secret/tls.key"
            }

            storage "file" {
              path = "/vault/data"
            }
  destination:
    server: https://default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle

